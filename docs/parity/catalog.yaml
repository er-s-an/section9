- id: RES-01
  name: Pulse/信号
  scope_and_acceptance: webhook/poll/manual/chat 输入、去重、抑制、归并、路由、数据源健康
  planned_milestone: M1/M4
  implementation_status: discovered
  verification_status: not_verified_by_this_plan
  owner: null
  evidence: []
  baseline_mapping_pending: true
  tracking:
    current_status: implemented
    status_basis: >-
      Partial bounded manual imports and explicitly enabled Langfuse/GitHub polling use persisted cursors/coverage and
      source-version deduplication. A local rule links a new poll version only to the unique active Incident that
      contains a recently operator-linked version of the exact same object in that source binding; ambiguity and
      observations older than 24 hours stay in the inbox. Monitoring is locally tested with mocked providers and
      exposes retry/coverage gaps. Real account health, alert routing, broad grouping, and suppression remain open.
    evidence:
    - s9/product/v1_api.py
    - s9/product/registry.py
    - tests/product/test_v1_langfuse_import.py
    - tests/product/test_v1_github_import.py
    - tests/product/test_signal_sync_monitor.py
    - tests/product/test_signal_incident_registry.py
    - frontend/tests/e2e/workspace-setup.spec.ts
- id: RES-02
  name: RCA
  scope_and_acceptance: 多假设、并行调查、反证、因果图、证据、影响服务、时间线
  planned_milestone: M2
  implementation_status: discovered
  verification_status: not_verified_by_this_plan
  owner: null
  evidence: []
  baseline_mapping_pending: true
  tracking:
    current_status: implemented
    status_basis: >-
      A manual InvestigationRun freezes input and evidence and records operator-entered Hypotheses and decisions.
      Single and Section9-owned swarm runs execute a durable deterministic task DAG through serial role-specific
      requests to one configured model; workspace token usage is reserved and settled or retained as unknown. This is
      locally mock-tested and does not prove independent agents. Authenticated workers, parallel execution, tool use,
      truly independent counterexamples, dynamic RCA, and causal graphs remain open.
    evidence:
    - s9/product/registry.py
    - s9/product/v1_api.py
    - s9/product/task_runtime.py
    - tests/product/test_v1_task_graph_api.py
    - tests/product/test_v1_investigation_api.py
    - frontend/tests/e2e/workspace-setup.spec.ts
